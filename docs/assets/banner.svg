<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">FFMix — independent DSP mixer for the RME Fireface 800</title>
  <desc id="desc">Dark banner with the FFMix wordmark and an abstract three-row mixer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191d"/>
      <stop offset="0.55" stop-color="#1a2025"/>
      <stop offset="1" stop-color="#111518"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fb8a4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fb8a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d99b3d" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#d99b3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <g id="strip">
